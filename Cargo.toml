[package]
name = "quran-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI Quran audio player (standalone + multi-output)"
license = "MIT"
repository = "https://github.com/fabhiansan/quran-tui"
homepage = "https://github.com/fabhiansan/quran-tui"
readme = "README.md"
keywords = ["quran", "tui", "audio", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
ratatui = { version = "0.29", features = ["serde"] }
crossterm = { version = "0.28", features = ["serde"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
directories = "5"
crossbeam-channel = "0.5"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
unicode-normalization = "0.1"
time = { version = "0.3", features = ["formatting"] }

# Unix-only: setsid() for daemon detach + flock() for single-instance lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS-only: media key + Now Playing integration via MPRemoteCommandCenter,
# plus a CFRunLoop pump so the souvlaki callback blocks fire from our TUI loop.
[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = { version = "0.8", default-features = false }
core-foundation = "0.9"
coreaudio-rs = "0.11"
objc = "0.2"

[profile.release]
strip = true
lto = "thin"
